<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConjugatePro Spanish</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f8fafc; }
    .accent-font { font-family: Georgia, 'Times New Roman', serif; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    .fade-in { animation: fadein 0.4s ease; }
    @keyframes bounce-dot { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    .bounce-dot { animation: bounce-dot 1.2s infinite ease-in-out both; }
  </style>
</head>
<body>
  <div class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <!-- Header -->
    <header class="w-full max-w-4xl mb-8 text-center">
      <h1 class="text-4xl md:text-5xl font-bold text-slate-800 mb-2 tracking-tight">
        Conjugate<span class="text-blue-600">Pro</span> Spanish
      </h1>
      <p class="text-slate-500 font-medium">Master your Spanish tenses with precision</p>
    </header>

    <main class="w-full max-w-4xl grid grid-cols-1 lg:grid-cols-3 gap-8 pb-32">

      <!-- Settings Panel -->
      <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col gap-6 h-fit">
        <h2 class="text-xl font-bold text-slate-700">Settings</h2>

        <div>
          <label class="block text-sm font-semibold text-slate-500 mb-1 uppercase tracking-wider">Tense</label>
          <p class="text-xs text-slate-400 mb-2">Select one or more</p>
          <div id="tense-buttons" class="flex flex-col gap-2"></div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-500 mb-1 uppercase tracking-wider">Verb Type</label>
          <p class="text-xs text-slate-400 mb-2">Select one or more</p>
          <div id="category-buttons" class="flex flex-col gap-2"></div>
        </div>

        <div class="pt-4 border-t border-slate-50">
          <button id="reset-stats"
            class="w-full py-2 px-4 border-2 border-slate-200 text-slate-400 font-bold rounded-xl hover:border-red-200 hover:text-red-500 transition-all">
            Reset Stats
          </button>
        </div>
      </section>

      <!-- Practice Area -->
      <section class="lg:col-span-2 flex flex-col gap-6">
        <div class="bg-white p-8 md:p-12 rounded-3xl shadow-xl border border-slate-100 relative overflow-hidden">
          <div class="absolute top-0 left-0 p-4">
            <button id="exit-retest" class="hidden px-3 py-1 bg-amber-100 text-amber-700 text-xs font-bold rounded-full uppercase hover:bg-amber-200 transition-colors">
              &larr; Exit Retest
            </button>
          </div>
          <div class="absolute top-0 right-0 p-4">
            <span id="tense-badge" class="px-3 py-1 bg-slate-100 text-slate-500 text-xs font-bold rounded-full uppercase"></span>
          </div>

          <div id="practice-card" class="flex flex-col items-center text-center">
            <!-- filled by JS -->
            <div class="flex items-center justify-center h-64 text-slate-400">Loading practice set...</div>
          </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-3 gap-4">
          <div class="p-4 rounded-2xl border text-center shadow-sm text-green-600 bg-green-50 border-green-100">
            <div id="stat-correct" class="text-2xl font-bold">0</div>
            <div class="text-xs font-semibold uppercase tracking-wider opacity-80">Correct</div>
          </div>
          <div id="stat-incorrect-tile" class="p-4 rounded-2xl border shadow-sm text-red-600 bg-red-50 border-red-100 flex flex-col items-center gap-2 text-center">
            <div class="w-full text-center">
              <div id="stat-incorrect" class="text-2xl font-bold text-center">0</div>
              <div class="text-xs font-semibold uppercase tracking-wider opacity-80">Missed</div>
            </div>
            <div class="w-full flex items-center justify-between text-xs font-bold uppercase tracking-wider pt-1 border-t border-red-100">
              <button id="menu-view" class="hover:underline">View</button>
              <button id="menu-retest" class="hover:underline">Retest</button>
            </div>
          </div>
          <div class="p-4 rounded-2xl border text-center shadow-sm text-blue-600 bg-blue-50 border-blue-100">
            <div id="stat-accuracy" class="text-2xl font-bold">0%</div>
            <div class="text-xs font-semibold uppercase tracking-wider opacity-80">Accuracy</div>
          </div>
        </div>
      </section>
    </main>

    <!-- Floating conjugation chart -->
    <div id="chart-panel" class="hidden fixed bottom-0 left-0 right-0 z-50 p-4 md:p-8">
      <div class="max-w-4xl mx-auto bg-white rounded-t-3xl shadow-2xl border-t border-l border-r border-slate-200 overflow-hidden">
        <div class="bg-slate-800 px-6 py-4 flex items-center justify-between text-white">
          <h4 id="chart-title" class="text-xl font-bold capitalize"></h4>
          <button id="chart-close" class="p-1 hover:bg-slate-700 rounded-full transition-colors" aria-label="Close chart">✕</button>
        </div>
        <div id="chart-body" class="p-6 md:p-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4"></div>
      </div>
    </div>

    <!-- Floating errors list -->
    <div id="errors-panel" class="hidden fixed bottom-0 left-0 right-0 z-50 p-4 md:p-8">
      <div class="max-w-4xl mx-auto bg-white rounded-t-3xl shadow-2xl border-t border-l border-r border-slate-200 overflow-hidden">
        <div class="bg-slate-800 px-6 py-4 flex items-center justify-between text-white">
          <h4 class="text-xl font-bold">Your Errors</h4>
          <div class="flex items-center gap-4">
            <button id="errors-retest" class="px-4 py-2 bg-amber-500 text-white text-sm font-bold rounded-xl hover:bg-amber-600 transition-colors">
              Retest Errors
            </button>
            <button id="errors-close" class="p-1 hover:bg-slate-700 rounded-full transition-colors" aria-label="Close errors">✕</button>
          </div>
        </div>
        <div id="errors-body" class="p-6 md:p-8 flex flex-col gap-3 max-h-96 overflow-y-auto"></div>
      </div>
    </div>

    <footer class="mt-auto py-8 text-slate-400 text-sm">
      &copy; 2024 ConjugatePro Spanish
    </footer>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
