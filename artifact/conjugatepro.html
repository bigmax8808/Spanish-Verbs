/* Custom styles carried over verbatim from templates/index.html. */
.accent-font { font-family: Georgia, 'Times New Roman', serif; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.fade-in { animation: fadein 0.4s ease; }

/* The design commits to a single light theme, matching the local app, so the
   light ground is pinned regardless of the viewer's theme preference. */
:root, :root[data-theme="dark"], :root[data-theme="light"] { color-scheme: light; }
html, body { background-color: #f8fafc; }

/* Keyboard focus needs to stay visible: the answer field suppresses the default
   outline in favour of its coloured bottom border, but nothing else should. */
button:focus-visible {
  outline: 2px solid #2563eb;
  outline-offset: 2px;
}

/* Settings collapse. The panel starts open everywhere; on a phone the heading
   doubles as a disclosure button so it can be folded away once it's set.
   From lg up there's a dedicated column for it and it is always open — the
   media query wins over the collapsed class rather than the JS having to
   track the breakpoint for layout. */
#settings-body { display: flex; }
#settings.is-collapsed #settings-body { display: none; }

/* The disclosure icon states what the tap will do — × closes the open panel,
   + opens the collapsed one. A filled circle rather than a bare glyph: the
   chevron this replaces was a thin grey mark that read as decoration. */
.settings-icon {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2rem;
  height: 2rem;
  border-radius: 9999px;
  background-color: #eff6ff;
  color: #2563eb;
  font-size: 1.25rem;
  font-weight: 700;
  line-height: 1;
  transition: background-color 0.2s ease;
}
#settings-toggle:hover .settings-icon { background-color: #dbeafe; }
.settings-icon-open { display: none; }
#settings.is-collapsed .settings-icon-close { display: none; }
#settings.is-collapsed .settings-icon-open { display: inline; }

@media (min-width: 1024px) {
  #settings.is-collapsed #settings-body { display: flex; }
  #settings-toggle { cursor: default; }
  .settings-icon { display: none; }
}

/* Tense switcher above the conjugation grid. Lives here rather than in Tailwind
   classes because the build's Tailwind scan doesn't see this file. It supplies
   the gap below the panel header, so the grid drops its own top padding rather
   than the two stacking into a gulf. */
.chart-tenses {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  padding: 1rem 1.5rem;
}
@media (min-width: 768px) {
  .chart-tenses { padding: 1.25rem 2rem; }
}
#chart-body { padding-top: 0; }

/* The extra row costs height that the shortest phones didn't have to spare, and
   a panel taller than the screen loses its own header — and its close button —
   off the top. Cap the panel and let the conjugations scroll inside it. */
#chart-panel > div {
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 2rem);
}
#chart-panel > div > *:not(#chart-body) { flex: none; }
#chart-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
@media (min-width: 768px) {
  #chart-panel > div { max-height: calc(100vh - 4rem); }
}

/* "Ver" and "Repasar" share a third of a phone screen, and the Spanish words are
   wider than the tile's default padding and letter-spacing leave room for. Only
   this tile is narrowed, so the three stat tiles still look identical. */
#stat-incorrect-tile { padding-left: 0.5rem; padding-right: 0.5rem; }
.tile-actions { letter-spacing: 0; gap: 0.25rem; }

@media (prefers-reduced-motion: reduce) {
  .fade-in { animation: none; }
  * { transition-duration: 0.01ms !important; }
}

function t(key) {
  const table = UI[state.lang] || UI.en;
  if (table[key] !== undefined) return table[key];
  if (UI.en[key] !== undefined) return UI.en[key]; // untranslated key falls back
  return key;
}

function tenseLabel(tense) {
  return t("tense." + tense);
}

function categoryLabel(category) {
  return t("cat." + category);
}

// Fill in the page shell's static strings from the active language.
function applyStaticStrings() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  document.querySelectorAll("[data-i18n-aria]").forEach((el) => {
    el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria")));
  });
}

// Switching language re-renders everything. A half-typed answer is carried
// across, so changing language mid-question doesn't cost the user their work,
// and the round itself is untouched — the same verb stays on screen.
function setLanguage(lang) {
  if (lang === state.lang) return;
  const field = document.getElementById("answer-input");
  const typed = field && !state.feedback ? field.value : null;
  state.lang = lang;
  applyStaticStrings();
  render();
  const refreshed = document.getElementById("answer-input");
  if (refreshed && typed !== null) refreshed.value = typed;
}

// --- State ---------------------------------------------------------------
let VERBS = [];
let SUBJECTS = [];

const state = {
  lang: "en", // interface language; the switch at the foot of Settings changes it
  // Both are now multi-select: each is a list of the currently-enabled options.
  selectedTenses: ["Present"],
  selectedCategories: ["Regular ar/er/ir"],
  currentVerb: null,
  currentTense: null, // the tense drawn for the current round
  chartTense: null, // tense shown in the conjugation panel; set when it opens
  currentSubject: null,
  feedback: null, // { isCorrect, isAccentError, correctAnswer, userAnswer }
  showChart: false,
  stats: { correct: 0, total: 0 },
  errors: [], // { infinitive, tense, subject, userAnswer, correctAnswer }
  showErrors: false,
  retestMode: false, // true while cycling only through current errors
  retestComplete: false, // true once every error has been cleared in retest mode
  lastVerbInfinitive: null,
  // Every verb+tense+subject combination already practiced this session.
  // Cleared only when stats are reset, so a combination never repeats until then.
  seen: new Set(),
  exhausted: false, // true once every available combination has been shown
};

// --- Helpers (ported from utils.ts) --------------------------------------
function normalizeString(str) {
  return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function getRandomItem(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function checkAnswer(userAnswer, correctAnswer) {
  const normUser = normalizeString(userAnswer.trim());
  const normCorrect = normalizeString(correctAnswer.trim());
  if (normUser === normCorrect) {
    if (userAnswer.trim() === correctAnswer.trim()) {
      return { isCorrect: true, isAccentError: false };
    }
    return { isCorrect: false, isAccentError: true };
  }
  return { isCorrect: false, isAccentError: false };
}

// --- Pronunciation (browser speech synthesis) ----------------------------
// The Flask app shells out to macOS `say` with an auto-detected Spanish voice.
// Here the viewer's own browser speaks instead, so the available voices depend
// on their device.
//
// Picking simply the first Spanish voice is wrong on macOS: the novelty voices
// (Eddy, Flo, Grandma, Rocko...) sort ahead of Mónica, and they're the wrong
// thing to imitate when you're learning pronunciation. Those voices all carry a
// parenthesised language in their name — "Eddy (Spanish (Spain))" — where the
// standard voices are plain ("Mónica", "Paulina"), so a plain name wins first.
let SPANISH_VOICE = null;

function pickSpanishVoice() {
  if (!window.speechSynthesis) return null;
  const voices = speechSynthesis.getVoices() || [];
  const lang = (v) => (v.lang || "").replace("_", "-").toLowerCase();
  const spanish = voices.filter((v) => lang(v).startsWith("es"));
  const plain = (v) => !v.name.includes("(");
  return (
    spanish.find((v) => lang(v).startsWith("es-es") && plain(v)) ||
    spanish.find(plain) ||
    spanish.find((v) => lang(v).startsWith("es-es")) ||
    spanish[0] ||
    null
  );
}

if (window.speechSynthesis) {
  // Voices often aren't populated on first call; the event fills them in later.
  SPANISH_VOICE = pickSpanishVoice();
  speechSynthesis.addEventListener("voiceschanged", () => {
    SPANISH_VOICE = pickSpanishVoice();
  });
}

function speakText(text) {
  if (!window.speechSynthesis || !text) return;
  try {
    // Cancel anything still speaking so rapid clicks don't queue up.
    speechSynthesis.cancel();
    if (!SPANISH_VOICE) SPANISH_VOICE = pickSpanishVoice();
    const utterance = new SpeechSynthesisUtterance(text);
    if (SPANISH_VOICE) utterance.voice = SPANISH_VOICE;
    utterance.lang = (SPANISH_VOICE && SPANISH_VOICE.lang) || "es-ES";
    utterance.rate = 0.95; // a shade slower: these are single words being learned
    speechSynthesis.speak(utterance);
  } catch (e) {
    console.error("speak error", e);
  }
}

// --- Round logic ---------------------------------------------------------
function comboKey(infinitive, tense, subject) {
  return `${infinitive}|${tense}|${subject}`;
}

// --- Error tracking --------------------------------------------------------
// Errors are keyed by verb+tense+subject so a repeated miss on the same
// combination updates the existing entry instead of duplicating it.
function findErrorIndex(infinitive, tense, subject) {
  return state.errors.findIndex(
    (e) => e.infinitive === infinitive && e.tense === tense && e.subject === subject
  );
}

function addOrUpdateError(entry) {
  const idx = findErrorIndex(entry.infinitive, entry.tense, entry.subject);
  if (idx >= 0) state.errors[idx] = entry;
  else state.errors.push(entry);
}

function removeError(infinitive, tense, subject) {
  const idx = findErrorIndex(infinitive, tense, subject);
  if (idx >= 0) state.errors.splice(idx, 1);
}

// Build the pool of candidates for retest mode: one entry per current error,
// resolved back to its full verb object.
function buildRetestCandidates() {
  return state.errors
    .map((e) => ({ verb: VERBS.find((v) => v.infinitive === e.infinitive), tense: e.tense, subject: e.subject }))
    .filter((c) => c.verb);
}

function enterRetestMode() {
  if (state.errors.length === 0) return;
  state.retestMode = true;
  state.retestComplete = false;
  state.showErrors = false;
  state.lastVerbInfinitive = null;
  startNewRound();
}

function exitRetestMode() {
  state.retestMode = false;
  state.retestComplete = false;
  state.lastVerbInfinitive = null;
  startNewRound();
}

function startRetestRound() {
  let candidates = buildRetestCandidates();

  if (candidates.length === 0) {
    state.retestComplete = true;
    state.currentVerb = null;
    state.currentTense = null;
    state.currentSubject = null;
    state.feedback = null;
    state.showChart = false;
    render();
    return;
  }
  state.retestComplete = false;

  if (state.lastVerbInfinitive && candidates.length > 1) {
    const filtered = candidates.filter((c) => c.verb.infinitive !== state.lastVerbInfinitive);
    if (filtered.length > 0) candidates = filtered;
  }

  const pick = getRandomItem(candidates);
  state.lastVerbInfinitive = pick.verb.infinitive;
  state.currentVerb = pick.verb;
  state.currentTense = pick.tense;
  state.currentSubject = pick.subject;
  state.feedback = null;
  state.showChart = false;

  render();
  const input = document.getElementById("answer-input");
  if (input) setTimeout(() => input.focus({ preventScroll: true }), 0);
}

// Build every not-yet-seen verb/tense/subject combination allowed by the
// current tense + verb-type selections.
function buildCandidates() {
  const candidates = [];
  for (const verb of VERBS) {
    if (!state.selectedCategories.includes(verb.category)) continue;
    for (const tense of state.selectedTenses) {
      for (const subject of SUBJECTS) {
        const key = comboKey(verb.infinitive, tense, subject);
        if (!state.seen.has(key)) candidates.push({ verb, tense, subject, key });
      }
    }
  }
  return candidates;
}

function startNewRound() {
  if (state.retestMode) {
    startRetestRound();
    return;
  }

  let candidates = buildCandidates();

  // Nothing left to ask under the current selection: every combination has
  // been practiced. Prompt the user to reset stats to start over.
  if (candidates.length === 0) {
    state.exhausted = true;
    state.currentVerb = null;
    state.currentTense = null;
    state.currentSubject = null;
    state.feedback = null;
    state.showChart = false;
    render();
    return;
  }
  state.exhausted = false;

  // Soft-avoid two rounds in a row on the same verb, but only if doing so
  // still leaves something to pick.
  if (state.lastVerbInfinitive && candidates.length > 1) {
    const filtered = candidates.filter(
      (c) => c.verb.infinitive !== state.lastVerbInfinitive
    );
    if (filtered.length > 0) candidates = filtered;
  }

  const pick = getRandomItem(candidates);
  state.seen.add(pick.key); // mark used so it never repeats until reset

  state.lastVerbInfinitive = pick.verb.infinitive;
  state.currentVerb = pick.verb;
  state.currentTense = pick.tense;
  state.currentSubject = pick.subject;
  state.feedback = null;
  state.showChart = false;

  render();
  const input = document.getElementById("answer-input");
  if (input) setTimeout(() => input.focus({ preventScroll: true }), 0);
}

// "Siguiente verbo" is the one place a scroll is wanted: the new verb should be
// the first thing on screen rather than wherever the last result left the page.
// Published inside the host frame the page may not scroll itself, in which case
// this is a harmless no-op.
function handleNext() {
  startNewRound();
  const panel = document.getElementById("practice-panel");
  // Instant, not smooth: the verb should already be there when the user looks
  // up, and a smooth scroll on iOS competes with the keyboard dismissing.
  if (panel && panel.scrollIntoView) panel.scrollIntoView({ block: "start" });
}

function handleSubmit() {
  if (state.feedback || !state.currentVerb || !state.currentSubject) return;
  const input = document.getElementById("answer-input");
  const userInput = input ? input.value : "";

  const correctAnswer =
    state.currentVerb.conjugations[state.currentTense][state.currentSubject];
  const result = checkAnswer(userInput, correctAnswer);

  state.feedback = {
    isCorrect: result.isCorrect,
    isAccentError: result.isAccentError,
    correctAnswer,
    userAnswer: userInput,
  };
  if (result.isCorrect) {
    state.stats.correct += 1;
    state.stats.total += 1;
    removeError(state.currentVerb.infinitive, state.currentTense, state.currentSubject);
  } else {
    // A miss on a combo that's already in the error list (e.g. missed again
    // during retest) doesn't count as a new miss — it's the same error.
    const alreadyMissed =
      findErrorIndex(state.currentVerb.infinitive, state.currentTense, state.currentSubject) >= 0;
    if (!alreadyMissed) {
      state.stats.total += 1;
    }
    addOrUpdateError({
      infinitive: state.currentVerb.infinitive,
      tense: state.currentTense,
      subject: state.currentSubject,
      userAnswer: userInput,
      correctAnswer,
    });
  }

  render();
}

// --- Rendering -----------------------------------------------------------

function speakerBtn(text, size = 20) {
  return `<button class="speak-btn p-1 text-slate-400 hover:text-blue-600 transition-colors align-middle"
            data-text="${text.replace(/"/g, "&quot;")}" title="${t("speak.listen")}"
            style="font-size:${size}px">&#128266;</button>`;
}

function render() {
  renderSettings();
  renderPractice();
  renderStats();
  renderChart();
  renderErrors();
  renderErrorTileButtons();
}

// Toggle a value in one of the multi-select lists, keeping at least one
// option enabled, then start a fresh round against the new pool. The `seen`
// history is intentionally preserved (only Reset Stats clears it).
function toggleSelection(list, value) {
  const idx = list.indexOf(value);
  if (idx >= 0) {
    if (list.length === 1) return; // never let the last option be turned off
    list.splice(idx, 1);
  } else {
    list.push(value);
  }
  startNewRound();
}

function renderSettings() {
  const tenseBox = document.getElementById("tense-buttons");
  const catBox = document.getElementById("category-buttons");
  const btn = (label, active) =>
    `<button class="px-4 py-3 rounded-xl font-medium transition-all text-left flex items-center gap-2 ${
      active
        ? "bg-blue-600 text-white shadow-md shadow-blue-100"
        : "bg-slate-50 text-slate-600 hover:bg-slate-100"
    }">
      <span class="text-xs ${active ? "opacity-100" : "opacity-30"}">${active ? "&#9745;" : "&#9744;"}</span>
      <span>${label}</span>
    </button>`;

  const langBox = document.getElementById("lang-buttons");
  langBox.innerHTML = LANGUAGES.map(
    ([code, label]) =>
      `<button class="flex-1 px-3 py-2 rounded-xl font-medium transition-all text-center ${
        state.lang === code
          ? "bg-blue-600 text-white shadow-md shadow-blue-100"
          : "bg-slate-50 text-slate-600 hover:bg-slate-100"
      }">${label}</button>`
  ).join("");
  [...langBox.children].forEach((el, i) => {
    el.onclick = () => setLanguage(LANGUAGES[i][0]);
  });

  tenseBox.innerHTML = TENSES.map((tense) =>
    btn(tenseLabel(tense), state.selectedTenses.includes(tense))
  ).join("");
  catBox.innerHTML = CATEGORIES.map((category) =>
    btn(categoryLabel(category), state.selectedCategories.includes(category))
  ).join("");

  [...tenseBox.children].forEach((el, i) => {
    el.onclick = () => toggleSelection(state.selectedTenses, TENSES[i]);
  });
  [...catBox.children].forEach((el, i) => {
    el.onclick = () => toggleSelection(state.selectedCategories, CATEGORIES[i]);
  });

  // The tense is shown under the answer field, so the badge is only used for
  // the retest-mode indicator and stays hidden during normal practice.
  const badge = document.getElementById("tense-badge");
  badge.textContent = state.retestMode
    ? `${t("retest.badge")} · ${state.errors.length} ${t("retest.missed")}`
    : "";
  badge.classList.toggle("hidden", !state.retestMode);

  const exitBtn = document.getElementById("exit-retest");
  exitBtn.classList.toggle("hidden", !state.retestMode);
  exitBtn.onclick = exitRetestMode;
}

function renderPractice() {
  const card = document.getElementById("practice-card");
  const { currentVerb, currentSubject, feedback } = state;

  if (state.retestMode && state.retestComplete) {
    card.innerHTML = `
      <div class="flex flex-col items-center justify-center h-64 gap-4 fade-in text-center">
        <div class="text-5xl">&#127881;</div>
        <p class="text-xl font-bold text-slate-700">${t("cleared.title")}</p>
        <p class="text-slate-500 max-w-sm">${t("cleared.body")}</p>
        <button id="retest-return" class="mt-2 px-8 py-3 bg-blue-600 text-white font-bold rounded-2xl hover:bg-blue-700 transition-all shadow-lg shadow-blue-200 active:scale-95">
          ${t("cleared.return")}
        </button>
      </div>`;
    const returnBtn = document.getElementById("retest-return");
    if (returnBtn) returnBtn.onclick = exitRetestMode;
    return;
  }

  if (state.exhausted) {
    card.innerHTML = `
      <div class="flex flex-col items-center justify-center h-64 gap-4 fade-in text-center">
        <div class="text-5xl">&#127881;</div>
        <p class="text-xl font-bold text-slate-700">${t("done.title")}</p>
        <p class="text-slate-500 max-w-sm">${t("done.body")}</p>
        <button id="exhausted-reset" class="mt-2 px-8 py-3 bg-blue-600 text-white font-bold rounded-2xl hover:bg-blue-700 transition-all shadow-lg shadow-blue-200 active:scale-95">
          ${t("done.reset")}
        </button>
      </div>`;
    const resetBtn = document.getElementById("exhausted-reset");
    if (resetBtn) resetBtn.onclick = resetStats;
    return;
  }

  if (!currentVerb || !currentSubject) {
    card.innerHTML =
      `<div class="flex items-center justify-center h-64 text-slate-400">${t("app.loading")}</div>`;
    return;
  }

  const meaningRow = feedback
    ? `<p class="text-slate-400 italic text-lg capitalize fade-in">${currentVerb.meaning}</p>`
    : "";

  let feedbackBlock = "";
  if (feedback) {
    const body = feedback.isCorrect
      ? `<div class="text-center">
           <p class="text-green-700 font-bold text-xl">&#10004; ${t("result.correct")}</p>
           <div class="mt-2 flex items-center justify-center gap-2">
             <span class="text-slate-600">${t("result.wellDone")}</span>
             <span class="font-bold text-green-700 text-lg">${feedback.correctAnswer}</span>
             ${speakerBtn(feedback.correctAnswer, 18)}
           </div>
         </div>`
      : `<div class="text-center">
           <p class="text-red-700 font-bold text-xl">&#10008; ${
             feedback.isAccentError ? t("result.accentError") : t("result.incorrect")
           }</p>
           ${
             feedback.isAccentError
               ? `<p class="text-amber-600 font-semibold mt-1 text-sm">${t("result.accentsRequired")}</p>`
               : ""
           }
           <div class="mt-2 flex items-center justify-center gap-2">
             <span class="text-slate-600">${t("result.spelling")}</span>
             <span class="font-bold text-red-700 text-lg underline decoration-wavy decoration-red-300">${feedback.correctAnswer}</span>
             ${speakerBtn(feedback.correctAnswer, 18)}
           </div>
         </div>`;

    feedbackBlock = `
      <div class="w-full mt-4 flex flex-col items-center fade-in">
        <div class="p-6 rounded-2xl w-full max-w-md ${
          feedback.isCorrect ? "bg-green-50 border border-green-100" : "bg-red-50 border border-red-100"
        }">
          ${body}
        </div>
        <button id="next-btn" class="mt-8 px-10 py-4 bg-blue-600 text-white font-bold rounded-2xl hover:bg-blue-700 transition-all shadow-lg shadow-blue-200 active:scale-95">
          ${t("answer.next")}
        </button>
        <button id="chart-toggle" class="mt-4 text-sm font-semibold text-blue-600 hover:text-blue-800 transition-colors">
          &#128214; ${t(state.showChart ? "chart.hide" : "chart.show")}
        </button>
      </div>`;
  } else {
    feedbackBlock = `
      <button id="check-btn" class="px-10 py-3 bg-slate-800 text-white font-bold rounded-xl hover:bg-slate-900 transition-all active:scale-95 shadow-lg shadow-slate-200">
        ${t("answer.check")}
      </button>`;
  }

  const inputBorder = feedback
    ? feedback.isCorrect
      ? "border-green-500 text-green-600"
      : "border-red-500 text-red-600"
    : "border-slate-200 focus:border-blue-400 text-slate-500";

  card.innerHTML = `
    <div class="mb-2">
      <div class="flex items-center justify-center gap-3 mb-2">
        <h3 class="text-5xl font-bold text-slate-800 accent-font">${currentVerb.infinitive}</h3>
        ${speakerBtn(currentVerb.infinitive, 24)}
      </div>
      <!-- The meaning is blank until the answer is checked, but its row keeps
           its height so revealing it doesn't shift the card. -->
      <div class="h-8">${meaningRow}</div>
    </div>

    <div class="w-full flex flex-col items-center gap-6 mt-2">
      <div class="w-full flex flex-col items-center gap-4">
        <!-- Subject and tense for this round, stacked above the field so a narrow
             screen never has to squeeze the two side by side. -->
        <div class="px-6 py-3 bg-slate-50 rounded-2xl border border-slate-100 shadow-sm text-2xl font-semibold text-slate-600 text-center">
          ${currentSubject} &mdash; ${tenseLabel(state.currentTense)}
        </div>
        <input id="answer-input" type="text" ${feedback ? "disabled" : ""}
          placeholder="${t("answer.placeholder")}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
          value="${feedback ? feedback.userAnswer.replace(/"/g, "&quot;") : ""}"
          class="w-full max-w-xs h-16 px-4 border-b-4 focus:outline-none transition-all text-center font-bold bg-transparent rounded-t-lg ${inputBorder}" />
      </div>
      ${feedbackBlock}
    </div>`;

  // Wire events
  const input = document.getElementById("answer-input");
  if (input && !feedback) {
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        handleSubmit();
      }
    });
  }
  const checkBtn = document.getElementById("check-btn");
  if (checkBtn) checkBtn.onclick = handleSubmit;
  const nextBtn = document.getElementById("next-btn");
  if (nextBtn) nextBtn.onclick = handleNext;
  const chartToggle = document.getElementById("chart-toggle");
  if (chartToggle)
    chartToggle.onclick = () => {
      state.showChart = !state.showChart;
      if (state.showChart) state.chartTense = state.currentTense;
      renderChart();
    };

  wireSpeakButtons(card);
}

function renderStats() {
  const { correct, total } = state.stats;
  document.getElementById("stat-correct").textContent = correct;
  // Mirrors the "Retest Mode · N Missed" count: currently-unresolved errors.
  document.getElementById("stat-incorrect").textContent = state.errors.length;
  document.getElementById("stat-accuracy").textContent =
    (total > 0 ? Math.round((correct / total) * 100) : 0) + "%";
}

function renderErrors() {
  const panel = document.getElementById("errors-panel");
  if (!state.showErrors) {
    panel.classList.add("hidden");
    return;
  }
  panel.classList.remove("hidden");

  const body = document.getElementById("errors-body");
  body.innerHTML = state.errors.length
    ? state.errors
        .slice()
        .reverse()
        .map(
          (err) => `
      <div class="p-4 rounded-2xl border bg-red-50 border-red-100 flex items-center justify-between gap-4">
        <div>
          <div class="text-xs font-bold text-slate-400 uppercase tracking-tighter mb-1">${err.infinitive} &middot; ${tenseLabel(err.tense)} &middot; ${err.subject}</div>
          <div class="text-sm text-slate-500">${t("errors.wrote")} <span class="font-semibold text-red-600">${err.userAnswer || t("errors.blank")}</span></div>
        </div>
        <div class="text-right">
          <div class="text-xs font-bold text-slate-400 uppercase tracking-tighter mb-1">${t("errors.correct")}</div>
          <div class="font-bold text-green-700">${err.correctAnswer}</div>
        </div>
      </div>`
        )
        .join("")
    : `<p class="text-slate-400 text-center py-8">${t("errors.none")}</p>`;

  const retestBtn = document.getElementById("errors-retest");
  retestBtn.disabled = state.errors.length === 0;
  retestBtn.classList.toggle("opacity-40", state.errors.length === 0);
  retestBtn.classList.toggle("cursor-not-allowed", state.errors.length === 0);

  document.getElementById("errors-close").onclick = () => {
    state.showErrors = false;
    renderErrors();
  };
}

function syncChartToggleLabel() {
  const btn = document.getElementById("chart-toggle");
  if (btn)
    btn.innerHTML = `&#128214; ${t(state.showChart ? "chart.hide" : "chart.show")}`;
}

function renderChart() {
  syncChartToggleLabel();
  const panel = document.getElementById("chart-panel");
  if (!state.showChart || !state.currentVerb) {
    panel.classList.add("hidden");
    return;
  }
  panel.classList.remove("hidden");

  // Falls back to the round's tense so the panel is never blank if it is
  // rendered before a toggle has set one.
  const shown = state.chartTense || state.currentTense;
  document.getElementById(
    "chart-title"
  ).innerHTML = `&#128214; ${state.currentVerb.infinitive} (${tenseLabel(
    shown
  )})`;

  // Only the tenses the verb data actually holds — a missing one would render
  // a row of undefineds rather than fail.
  const chartTenses = TENSES.filter((tense) => state.currentVerb.conjugations[tense]);
  const tenseBox = document.getElementById("chart-tenses");
  tenseBox.innerHTML = chartTenses
    .map(
      (tense) =>
        `<button class="px-4 py-2 rounded-xl font-medium transition-all ${
          tense === shown
            ? "bg-blue-600 text-white shadow-md shadow-blue-100"
            : "bg-slate-50 text-slate-600 hover:bg-slate-100"
        }">${tenseLabel(tense)}</button>`
    )
    .join("");
  [...tenseBox.children].forEach((el, i) => {
    el.onclick = () => {
      state.chartTense = chartTenses[i];
      renderChart();
    };
  });

  const body = document.getElementById("chart-body");
  body.innerHTML = SUBJECTS.map((subj) => {
    const conj = state.currentVerb.conjugations[shown][subj];
    // The highlight marks the form being asked, so it belongs to the round's
    // own tense and goes away when another tense is being browsed.
    const active = subj === state.currentSubject && shown === state.currentTense;
    return `<div class="p-4 rounded-2xl border ${
      active ? "bg-blue-50 border-blue-200 shadow-sm" : "bg-slate-50 border-slate-100"
    }">
      <div class="text-xs font-bold text-slate-400 uppercase tracking-tighter mb-1">${subj}</div>
      <div class="flex items-center justify-between gap-2">
        <div class="text-xl font-bold ${active ? "text-blue-700" : "text-slate-700"}">${conj}</div>
        ${speakerBtn(conj, 14)}
      </div>
    </div>`;
  }).join("");

  document.getElementById("chart-close").onclick = () => {
    state.showChart = false;
    renderChart();
  };
  wireSpeakButtons(body);
}

function wireSpeakButtons(root) {
  root.querySelectorAll(".speak-btn").forEach((btn) => {
    btn.onclick = () => speakText(btn.dataset.text);
  });
}

// --- Init ----------------------------------------------------------------
// Reset clears the score *and* the seen-combination history, so every verb/
// tense/subject becomes available to be asked again.
function resetStats() {
  state.stats = { correct: 0, total: 0 };
  state.errors = [];
  state.showErrors = false;
  state.retestMode = false;
  state.retestComplete = false;
  state.seen = new Set();
  state.lastVerbInfinitive = null;
  state.exhausted = false;
  renderErrors();
  renderErrorTileButtons();
  startNewRound(); // repopulate the pool and show a new question
}

document.getElementById("reset-stats").onclick = resetStats;

document.getElementById("menu-view").onclick = () => {
  state.showErrors = true;
  renderErrors();
};
document.getElementById("menu-retest").onclick = () => {
  enterRetestMode();
};
document.getElementById("errors-retest").onclick = () => {
  state.showErrors = false;
  renderErrors();
  enterRetestMode();
};

function renderErrorTileButtons() {
  const retestBtn = document.getElementById("menu-retest");
  retestBtn.disabled = state.errors.length === 0;
  retestBtn.classList.toggle("opacity-40", state.errors.length === 0);
  retestBtn.classList.toggle("cursor-not-allowed", state.errors.length === 0);
}

function init() {
  VERBS = VERB_DATA.verbs;
  SUBJECTS = VERB_DATA.subjects;
  // Fill the shell's static strings before the first round is drawn.
  applyStaticStrings();
  startNewRound();
}

init();

</script>

<script>
// Settings disclosure. The panel starts open (no is-collapsed class in the
// markup). Only the collapsed *class* is managed here; whether that class has
// any effect is the stylesheet's call, so the panel is always open from lg up
// without this script knowing the breakpoint. The click is ignored on wide
// screens so the heading doesn't silently toggle a hidden state.
(function () {
  const panel = document.getElementById("settings");
  const toggle = document.getElementById("settings-toggle");
  const narrow = window.matchMedia("(max-width: 1023px)");

  function syncAria() {
    const open = !narrow.matches || !panel.classList.contains("is-collapsed");
    toggle.setAttribute("aria-expanded", String(open));
  }

  toggle.addEventListener("click", () => {
    if (!narrow.matches) return;
    panel.classList.toggle("is-collapsed");
    syncAria();
  });

  narrow.addEventListener("change", syncAria);
  syncAria();
})();
</script>
